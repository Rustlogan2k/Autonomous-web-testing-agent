# WebRLED (Gu et al., 2025), the published baseline, run from its released artifact on the same
# GitHub-hosted runners and one-hour budget as our agents (external-comparison.yml), so the
# comparison does not rest on numbers measured on other machines. Started by pushing to the
# webrled-gha branch (the full plan) or by hand.
#
# The artifact (webrled.zip, 3 GB, and express-istanbul.zip) is downloaded from the authors'
# Google Drive once and kept in the Actions cache; every run restores it from there.
# scripts/webrled/run_webrled.sh runs one application and lists the two changes made (CPU
# torch build, virtual display); scripts/webrled/score_webrled.py scores the uploaded coverage
# with our own counter.
name: WebRLED baseline

on:
  # A push to this branch runs the default plan (the inputs' defaults below).
  push:
    branches: [webrled-gha]
  workflow_dispatch:
    inputs:
      apps:
        description: "applications (space-separated)"
        default: "dimeshift pagekit splittypie phoenix retroboard petclinic"
      runs:
        # Runs 1-5: 2026-10-29 (run 40829426407). Runs 6-10: 2026-10-30, ten runs per
        # application for both tools, so per-app differences of 2-3 points can be resolved.
        description: "run numbers (space-separated)"
        default: "6 7 8 9 10"
      time_limit:
        description: "seconds of testing per run (3600 as released)"
        default: "3600"

permissions:
  contents: read

env:
  CACHE_KEY: webrled-artifact-1oWr9jGU-1LjwhgvN

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: cached
        uses: actions/cache/restore@v4
        with:
          path: artifact
          key: ${{ env.CACHE_KEY }}
          lookup-only: true
      - if: steps.cached.outputs.cache-hit != 'true'
        name: Download the artifact from the authors' Google Drive
        run: |
          python3 -m pip install --quiet gdown==6.4.2
          mkdir -p artifact
          gdown --continue -O artifact/webrled.zip 1oWr9jGUyITl96InW_zFmuqTqB3W_iriw
          gdown --continue -O artifact/express-istanbul.zip 1LjwhgvNwRVtFlwuWpxhQ1IfsW_qz0RCv
          ls -l artifact
          test "$(stat -c %s artifact/webrled.zip)" -eq 3052458257
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifact
          key: ${{ env.CACHE_KEY }}
      - id: plan
        env:
          APPS: ${{ inputs.apps || 'dimeshift pagekit splittypie phoenix retroboard petclinic' }}
          RUNS: ${{ inputs.runs || '6 7 8 9 10' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import itertools, json, os
          runs = [{"app": a, "run": r} for a, r in itertools.product(
              os.environ["APPS"].split(), os.environ["RUNS"].split())]
          print("matrix=" + json.dumps({"include": runs}))
          EOF

  run:
    needs: prepare
    # The release was verified on Ubuntu 22.04 (its README); its pinned Playwright (1.44)
    # cannot install browser dependencies on 24.04 (ubuntu-latest): libasound2 was renamed.
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space, virtual display
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - uses: actions/cache/restore@v4
        with:
          path: artifact
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "10.24.1"
      - name: Unpack
        run: |
          mkdir -p "$RUNNER_TEMP/w"
          unzip -q artifact/webrled.zip -d "$RUNNER_TEMP/w"
          unzip -q artifact/express-istanbul.zip -d "$RUNNER_TEMP/w"
          rm -rf artifact
          ls "$RUNNER_TEMP/w"
      - name: Start the application (WebRLED README, step 3.1.1)
        run: |
          case "${{ matrix.app }}" in
            dimeshift) docker run -d -t --workdir=/home/dimeshift-application --name=app -p 4000:8080 \
                         --entrypoint ./run-code-instrumentation.sh dockercontainervm/dimeshift:latest bash
                       URL=http://localhost:4000/ ;;
            pagekit) docker run -d -t --workdir=/var/www/html/pagekit --name=app -p 4001:80 \
                       --entrypoint ./run-code-instrumentation.sh dockercontainervm/pagekit:latest bash
                     URL=http://localhost:4001/pagekit/index.php/admin/login ;;
            splittypie) docker run -d -t --workdir=/home/splittypie --name=app -p 4005:4200 \
                          --entrypoint ./run-code-instrumentation.sh dockercontainervm/splittypie:latest bash
                        URL=http://localhost:4005 ;;
            phoenix) docker run -d -t --workdir=/home/phoenix-trello --name=app -p 4003:4000 \
                       --env PATH=/root/.kiex/elixirs/elixir-1.3.1/bin:/root/.kiex/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                       --entrypoint ./run-code-instrumentation.sh dockercontainervm/phoenix-trello:latest bash
                     URL=http://localhost:4003 ;;
            retroboard) docker run -d -t --workdir=/home/retro-board --name=app -p 4004:8080 \
                          --entrypoint ./run-code-instrumentation.sh dockercontainervm/retroboard:latest bash
                        URL=http://localhost:4004 ;;
            petclinic) docker run -d -t --workdir=/home/spring-petclinic-angularjs --name=app -p 4002:8080 \
                         --env PATH=/root/workspace/maven/apache-maven-3.5.4/bin:/root/workspace/java/jdk1.8.0_181/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                         --entrypoint ./run-code-instrumentation.sh dockercontainervm/petclinic:latest bash
                       URL=http://localhost:4002 ;;
            *) echo "unknown app ${{ matrix.app }}"; exit 1 ;;
          esac
          for i in $(seq 1 120); do
            curl -sf -o /dev/null "$URL" && echo "ready after ${i}0 s" && exit 0
            sleep 10
          done
          docker logs app | tail -50; exit 1
      - name: Run WebRLED
        env:
          APP: ${{ matrix.app }}
          TIME_LIMIT: ${{ inputs.time_limit || '3600' }}
          OUT_DIR: out
        run: |
          WEBRLED_DIR="$RUNNER_TEMP/w/webrled" ISTANBUL_DIR="$RUNNER_TEMP/w/express-istanbul" \
            bash scripts/webrled/run_webrled.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webrled__${{ matrix.app }}__run-${{ matrix.run }}
          path: out/
          if-no-files-found: warn
