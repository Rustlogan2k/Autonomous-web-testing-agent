<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basket — Fernbrook Outfitters</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="masthead">
  <a class="wordmark" href="index.html">Fernbrook<span>Outfitters</span></a>
  <nav class="primary" aria-label="Primary">
    <a href="index.html">Store</a>
    <a href="collection-shelter.html">Shelter</a>
    <a href="collection-cooking.html">Cooking</a>
    <a href="basket.html" id="basket-link">Basket</a>
  </nav>
</header>
<main class="page">
  <h1>Your basket</h1>

  <div id="empty-basket" class="panel hidden">
    <p>Your basket is empty.</p>
    <a class="action" href="collection-shelter.html">Browse shelter</a>
  </div>

  <div id="basket-panel" class="panel hidden">
    <table class="product-table">
      <thead><tr><th>Item</th><th>Quantity</th><th>Line total</th></tr></thead>
      <tbody id="basket-rows"></tbody>
    </table>
    <div class="summary-line"><span>Subtotal</span><span id="basket-subtotal">&pound;0.00</span></div>
    <div class="summary-line"><span>Delivery</span><span id="basket-delivery">&pound;4.95</span></div>
    <div class="summary-line total"><span>Total</span><span id="basket-total">&pound;0.00</span></div>
    <p style="margin-top:14px">
      <a class="action" href="checkout.html" id="go-to-checkout">Continue to checkout</a>
      <button class="action quiet" type="button" id="empty-the-basket">Empty basket</button>
    </p>
  </div>

  <p><a href="delivery.html">Delivery times</a> &middot; <a href="returns.html">Returns</a></p>
</main>
<footer class="footer">
  <a href="delivery.html">Delivery</a>
  <a href="returns.html">Returns</a>
  <a href="sizing.html">Sizing</a>
  <a href="stockists.html">Stockists</a>
  <a href="privacy.html">Privacy notice</a>
</footer>
<script src="assets/basket.js"></script>
<script>
  (function () {
    var lines = basketLines();
    var panel = document.getElementById('basket-panel');
    var empty = document.getElementById('empty-basket');

    if (!lines.length) {
      empty.classList.remove('hidden');
      return;
    }
    panel.classList.remove('hidden');

    var body = document.getElementById('basket-rows');
    lines.forEach(function (line) {
      var row = document.createElement('tr');
      row.innerHTML =
        '<td>' + line.name + '</td>' +
        '<td class="basket-qty">' + line.quantity + '</td>' +
        '<td>&pound;' + money(line.line) + '</td>';
      body.appendChild(row);
    });

    var subtotal = basketTotal();
    document.getElementById('basket-subtotal').textContent = '£' + money(subtotal);
    document.getElementById('basket-total').textContent = '£' + money(subtotal + 4.95);

    document.getElementById('empty-the-basket').addEventListener('click', function () {
      clearBasket();
      window.location.reload();
    });
  })();
</script>
</body>
</html>
