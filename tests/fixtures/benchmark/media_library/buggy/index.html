<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reelhouse · Recordings library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/reelhouse.css">
</head>
<body>
<div id="chrome">
  <header class="deck">
    <a class="brand" id="nav-brand" href="index.html" data-nav="index.html">
      <svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"></circle>
        <circle cx="16" cy="16" r="4.5" fill="currentColor"></circle>
        <path d="M16 2v6M16 24v6M2 16h6M24 16h6" stroke="currentColor" stroke-width="2"></path>
      </svg>
      Reelhouse
    </a>
    <span class="station">Kestrel FM recordings library</span>
    <nav class="deck-nav" aria-label="Sections">
      <a id="nav-library" class="is-here" href="index.html" data-nav="index.html">Library</a>
      <a id="nav-collections" href="collections.html" data-nav="collections.html">Collections</a>
      <a id="nav-help" href="help.html" data-nav="help.html">Help and clearance guide</a>
    </nav>
  </header>

  <main class="bench">
    <div class="bench-head">
      <h1>Recordings</h1>
      <div class="bench-buttons">
        <button type="button" class="key key-strong" id="add-recording">Add recording</button>
        <button type="button" class="key" id="archive-notes">Archive notes</button>
      </div>
    </div>

    <div class="rack" role="group" aria-label="Arrange and filter the recordings">
      <div class="rack-slot">
        <label for="arrange-by">Arrange by</label>
        <select id="arrange-by" name="arrange_by">
          <option value="shelf">Shelf number</option>
          <option value="title">Title, A to Z</option>
          <option value="length">Running time, shortest first</option>
          <option value="programme">Programme</option>
        </select>
      </div>
      <div class="rack-slot">
        <label for="show-programme">Show programme</label>
        <select id="show-programme" name="show_programme">
          <option value="all">Every programme</option>
          <option value="news">News</option>
          <option value="features">Features</option>
          <option value="music">Music sessions</option>
          <option value="sport">Sport</option>
        </select>
      </div>
      <div class="rack-slot rack-slot-wide">
        <label for="find-text">Find in titles and summaries</label>
        <input type="search" id="find-text" name="find_text" autocomplete="off">
      </div>
      <div class="rack-slot rack-slot-end">
        <button type="button" class="key" id="reset-view">Reset view</button>
      </div>
    </div>

    <p class="readout" id="grid-status"></p>
    <ul class="reels" id="reel-grid"></ul>
  </main>

  <footer class="foot">
    <p>Reelhouse keeps the station's finished audio. Raw studio takes stay on the studio machines.</p>
  </footer>
</div>

<div id="dialog-root"></div>

<script src="assets/store.js"></script>
<script src="assets/library.js"></script>
</body>
</html>
