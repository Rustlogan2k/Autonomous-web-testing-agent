<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipment register &mdash; Brasswick Asset Register</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/console.css">
</head>
<body data-page="equipment">
<div class="shell">
  <aside class="rail">
    <p class="product">Brasswick <span>Asset Register</span></p>
    <nav aria-label="Console sections">
      <a id="nav-overview" href="index.html">Overview</a>
      <a id="nav-equipment" href="equipment.html" aria-current="page">Equipment register</a>
      <a id="nav-locations" href="locations.html">Locations</a>
      <a id="nav-register" href="register.html">Register equipment</a>
      <a id="nav-changes" href="changes.html">Change log</a>
      <a id="nav-preferences" href="preferences.html">Preferences</a>
      <a id="nav-guide" href="guide.html">Operator guide</a>
    </nav>
    <p class="rail-foot">Signed in as duty registrar</p>
  </aside>
  <main class="stage" id="stage">
    <div id="notice-slot"></div>
    <h1>Equipment register</h1>
    <p class="lede" id="scope-line"></p>

    <div class="toolbar">
      <div class="field">
        <label for="f-show-status">Show status</label>
        <select id="f-show-status" name="show_status">
          <option value="all">Every status</option>
          <option value="active">In service</option>
          <option value="repair">Under repair</option>
          <option value="loan">On loan</option>
          <option value="retired">Retired</option>
        </select>
      </div>
      <div class="field">
        <button type="button" class="ghost" id="apply-filter">Apply filter</button>
      </div>
      <span class="count" id="row-count"></span>
    </div>

    <div id="confirm-slot"></div>

    <section class="panel">
      <table class="grid">
        <thead>
          <tr>
            <th class="col-tag">Tag</th><th>Equipment</th><th>Location</th><th>Custodian</th>
            <th class="col-units">Units</th><th>Status</th><th class="col-actions">Record</th>
          </tr>
        </thead>
        <tbody id="equipment-rows"></tbody>
      </table>
    </section>

    <p class="actions">
      <a class="btn" id="add-equipment" href="register.html">Register new equipment</a>
    </p>
  </main>
</div>
<script src="assets/console.js"></script>
</body>
</html>
