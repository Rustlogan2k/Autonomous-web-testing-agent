<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Millrace Rooms &middot; hire desk</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/desk.css">
</head>
<body>
  <header class="mast">
    <div class="mast-brand">
      <span class="mast-mark" aria-hidden="true">M</span>
      <div>
        <p class="mast-name">Millrace Rooms</p>
        <p class="mast-tag">Rooms for hire by the hour at Millrace Works</p>
      </div>
    </div>
    <nav class="desk-nav" aria-label="Hire desk">
      <button type="button" id="nav-rooms" data-view="rooms">Rooms</button>
      <button type="button" id="nav-reservations" data-view="reservations">My reservations</button>
      <button type="button" id="nav-terms" data-view="terms">Hire terms</button>
      <button type="button" id="nav-location" data-view="location">Finding us</button>
      <button type="button" id="nav-access" data-view="access">Access and facilities</button>
      <button type="button" id="nav-help" data-view="help">Help</button>
    </nav>
  </header>

  <main id="view" class="view"></main>

  <footer class="foot">
    <p>Millrace Works, 4 Sluice Lane. The hire desk is staffed 08:30 to 18:00, Monday to Saturday.</p>
    <p>Reservations made here are kept for this browser tab only.</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
