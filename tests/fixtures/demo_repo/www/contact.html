<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Widget Co — Contact</title></head>
<body>
  <h1>Contact us</h1>
  <a id="nav-home" href="index.html">Home</a>
  <form id="contact-form" method="get" action="thanks.html">
    <input id="name" name="name" type="text" required>
    <!-- Seeded: declares a max length the form never enforces, because the value is
         carried in the query string and the page it lands on echoes it whole. -->
    <input id="message" name="message" type="text" maxlength="20">
    <button id="submit-contact" type="submit">Send</button>
  </form>
</body>
</html>
