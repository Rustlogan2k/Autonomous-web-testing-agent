<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwind Supply — Order confirmed</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 52rem; }
    nav a { display: inline-block; margin-right: 1rem; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin: 1rem 0; }
    footer { margin-top: 3rem; font-size: 0.85rem; color: #555; }
    footer a { margin-right: 0.8rem; }
    .hidden { display: none; }
    .crumb { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav>
    <a id="nav-home" href="index.html">Home</a>
    <a id="nav-catalog" href="catalog.html">Catalog</a>
    <a id="nav-support" href="support.html">Support</a>
    <a id="nav-about" href="about.html">About</a>
  </nav>
  <h1>Order confirmed</h1>
  <div class="card">
    <p>Thank you. Your order has been placed.</p>
    <p>Product: <span id="c-product">&mdash;</span></p>
    <p>Quantity: <span id="c-quantity">&mdash;</span></p>
    <p>Contact: <span id="c-email">&mdash;</span></p>
    <p><a id="c-home" href="index.html">Back to home</a></p>
  </div>
  <footer>
    <a id="f-terms" href="terms.html">Terms</a>
    <a id="f-privacy" href="privacy.html">Privacy</a>
    <a id="f-status" href="status.html">Status</a>
    <a id="f-contact" href="support.html">Contact us</a>
  </footer>

  <script>
    function params() { return new URLSearchParams(window.location.search); }
    function carry(extra) {
      const p = params();
      for (const k in extra) { p.set(k, extra[k]); }
      return p.toString();
    }
    function reveal(link, href) {
      link.setAttribute('href', href);
      link.classList.remove('hidden');
    }
  </script>
  <script>
    // DEEP-01 (broken_flow): the confirmed quantity is hard-coded to 1 instead of the
    // quantity chosen at step 2. Everything else on the page is correct, the page
    // returns 200, nothing is logged, and the review page one step earlier displayed
    // the right number -- so the only way to see it is to have carried a value through
    // four stages and compared it against what is echoed back here.
    //
    // Deliberately unreachable any other way: receipt.html is linked only from
    // order-4.html, which is revealed only by a valid email on order-3.html, which is
    // revealed only by a valid quantity on order-2.html, which is revealed only by a
    // selected product on order-1.html.
    const p = params();
    document.getElementById('c-product').textContent = p.get('product') || '(none)';
    document.getElementById('c-quantity').textContent = '1';
    document.getElementById('c-email').textContent = p.get('email') || '(none)';
  </script>
</body>
</html>
