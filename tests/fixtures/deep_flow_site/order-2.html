<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwind Supply — Order, step 2 of 4</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 52rem; }
    nav a { display: inline-block; margin-right: 1rem; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin: 1rem 0; }
    footer { margin-top: 3rem; font-size: 0.85rem; color: #555; }
    footer a { margin-right: 0.8rem; }
    .hidden { display: none; }
    .crumb { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav>
    <a id="nav-home" href="index.html">Home</a>
    <a id="nav-catalog" href="catalog.html">Catalog</a>
    <a id="nav-support" href="support.html">Support</a>
    <a id="nav-about" href="about.html">About</a>
  </nav>
  <p class="crumb">Step 2 of 4</p>
  <h1>How many?</h1>
  <div class="card">
    <!-- The accepted range must be reachable by the explorer's own vocabulary, or the
         flow is impassable by any policy and the fixture measures nothing. The action
         registry generates exactly five values per numeric field (input_values.py):
         valid_typical "42", boundary_min "0", boundary_max "999999999", "" and
         "not-a-number". An earlier 1-10 gate rejected all five, so the flow was
         unreachable and every run stalled at this stage.
         1-100 admits 42 while still correctly rejecting 0, 999999999 and the rest. -->
    <label for="quantity">Quantity (1&ndash;100)</label>
    <input type="number" id="quantity" name="quantity" min="1" max="100" step="1">
    <p id="qty-error" class="hidden">Enter a whole number between 1 and 100.</p>
    <p><a id="to-step-3" class="hidden" href="#">Continue</a></p>
    <a id="back-1" href="order-1.html">Back</a>
    <a id="cancel-2" href="index.html">Cancel order</a>
  </div>
  <footer>
    <a id="f-terms" href="terms.html">Terms</a>
    <a id="f-privacy" href="privacy.html">Privacy</a>
    <a id="f-status" href="status.html">Status</a>
    <a id="f-contact" href="support.html">Contact us</a>
  </footer>

  <script>
    function params() { return new URLSearchParams(window.location.search); }
    function carry(extra) {
      const p = params();
      for (const k in extra) { p.set(k, extra[k]); }
      return p.toString();
    }
    function reveal(link, href) {
      link.setAttribute('href', href);
      link.classList.remove('hidden');
    }
  </script>
  <script>
    const qty = document.getElementById('quantity');
    const next = document.getElementById('to-step-3');
    const err = document.getElementById('qty-error');
    qty.addEventListener('input', function () {
      const n = Number(qty.value);
      const ok = qty.value !== '' && Number.isInteger(n) && n >= 1 && n <= 100;
      if (ok) {
        err.classList.add('hidden');
        reveal(next, 'order-3.html?' + carry({ quantity: String(n) }));
      } else {
        next.classList.add('hidden');
        if (qty.value !== '') { err.classList.remove('hidden'); }
      }
    });
  </script>
</body>
</html>
