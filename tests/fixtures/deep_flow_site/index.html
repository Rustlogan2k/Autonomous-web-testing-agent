  <!-- NOTE: purpose lives in comments only. Rendered text reaches the LLM judge's
       prompt, and telling it that this is a fixture with a seeded bug biases it toward
       reporting one. This site must read as an ordinary small ordering app.

       This is the DEEP-FLOW fixture. Unlike toy_site (where nearly every bug sits one
       or two steps from the landing page), the single seeded bug here is reachable
       only after completing a four-stage ordering flow IN ORDER. Each stage reveals
       the next control only once its own input is valid, so the action space grows
       with progress and shrinks back on Cancel.

       That is the point: it is the regime where uniform-random exploration decays
       exponentially in sequence length, and therefore the only regime in which RL's
       actual claim — credit assignment over a multi-step flow — can be tested at all.
       See answer_key.json. -->
