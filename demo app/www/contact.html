<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbor &amp; Pine - Contact</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html">HARBOR &amp; PINE</a>
      <nav aria-label="Main navigation"><a href="index.html">Dashboard</a><a href="catalog.html">Catalog</a><a href="account.html">Account</a></nav>
    </header>
    <main>
      <div class="kicker">Support desk</div>
      <h1>Send a note.</h1>
      <p class="lede">We usually reply within one working day.</p>
      <form data-contact-form action="confirmation.html" method="post">
        <div class="field"><label for="name">Name</label><input id="name" name="name" required autocomplete="name"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="message">Message</label><textarea id="message" name="message" maxlength="20" required></textarea><div class="hint"><span data-count>0 characters</span> · maximum 20 characters</div></div>
        <button type="submit">Send message</button>
        <div class="status" role="status" aria-live="polite"></div>
      </form>
    </main>
  </div>
</body>
</html>
